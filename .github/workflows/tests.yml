name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-suites:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -e . --no-deps
          choco install ffmpeg -y --no-progress
          choco install ffmpeg -y --no-progress
      - name: Test suite
        shell: bash
        run: |
          set -o pipefail
          python -X utf8 -m pytest tests -q -p no:cacheprovider -rfE 2>&1 | tee pytest.log
      - name: Failures as annotations
        if: failure()
        shell: bash
        run: |
          grep -E "^(FAILED|ERROR) " pytest.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done
          grep -E "^E   " pytest.log | head -20 | while IFS= read -r line; do echo "::error::$line"; done
          tail -1 pytest.log | sed 's/^/::error::/'
