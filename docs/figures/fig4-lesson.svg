<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 466" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2d3142">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
  </defs>
  <style>
    .box{fill:#fff;stroke:#2d3142;stroke-width:1.5}
    .store{fill:#f3f4f6;stroke:#2d3142;stroke-width:1.5}
    .focal{fill:#fff;stroke:#c2410c;stroke-width:1.5}
    .t{font-weight:700}
    .s{fill:#6b7280;font-size:11px}
    .cap{fill:#6b7280;font-size:11px;font-style:italic}
    .l{stroke:#6b7280;stroke-width:1.5;fill:none;marker-end:url(#a)}
    .acc{stroke:#c2410c;stroke-width:1.5;fill:none;marker-end:url(#b)}
  </style>

  <!-- row 1: from a failure to the owner's verdict -->
  <rect x="20" y="70" width="150" height="80" rx="6" class="box"/>
  <text x="95" y="96" text-anchor="middle" class="t">Observation</text>
  <text x="95" y="114" text-anchor="middle" class="s">a failure noticed by the agent,</text>
  <text x="95" y="130" text-anchor="middle" class="s">a checkpoint or the owner</text>

  <rect x="200" y="70" width="170" height="80" rx="6" class="store"/>
  <text x="285" y="96" text-anchor="middle" class="t">Docket</text>
  <text x="285" y="114" text-anchor="middle" class="s">the runtime proposes members,</text>
  <text x="285" y="130" text-anchor="middle" class="s">the agent confirms or excludes</text>

  <rect x="390" y="70" width="180" height="80" rx="6" class="box"/>
  <text x="480" y="96" text-anchor="middle" class="t">Lesson proposed</text>
  <text x="480" y="114" text-anchor="middle" class="s">the cause, anchored in the</text>
  <text x="480" y="130" text-anchor="middle" class="s">method; the edit that removes it</text>

  <rect x="610" y="70" width="150" height="80" rx="6" class="focal"/>
  <text x="685" y="96" text-anchor="middle" class="t">Owner's verdict</text>
  <text x="685" y="114" text-anchor="middle" class="s">on the dashboard or in the</text>
  <text x="685" y="130" text-anchor="middle" class="s">weekly message</text>

  <!-- row 2 -->
  <rect x="390" y="210" width="180" height="70" rx="6" class="box"/>
  <text x="480" y="238" text-anchor="middle" class="t">Retired</text>
  <text x="480" y="258" text-anchor="middle" class="s">dropped on the owner's words</text>

  <rect x="610" y="210" width="150" height="70" rx="6" class="store"/>
  <text x="685" y="238" text-anchor="middle" class="t">Trial</text>
  <text x="685" y="256" text-anchor="middle" class="s">frozen arms, benchmark</text>
  <text x="685" y="270" text-anchor="middle" class="s">cases, file checks only</text>

  <!-- row 3 -->
  <rect x="390" y="340" width="180" height="70" rx="6" class="box"/>
  <text x="480" y="364" text-anchor="middle" class="t">Checked on later tasks</text>
  <text x="480" y="382" text-anchor="middle" class="s">helped or hurt, counted only with</text>
  <text x="480" y="398" text-anchor="middle" class="s">a task, a receipt and the version</text>

  <rect x="610" y="340" width="150" height="70" rx="6" class="store"/>
  <text x="685" y="368" text-anchor="middle" class="t">Applied</text>
  <text x="685" y="386" text-anchor="middle" class="s">exactly the edit shown</text>

  <!-- flows, row 1 -->
  <path d="M170,110 L200,110" class="l"/>
  <path d="M370,110 L390,110" class="l"/>
  <text x="285" y="172" text-anchor="middle" class="s">three in sixty days open a method review:</text>
  <text x="285" y="186" text-anchor="middle" class="s">one cause, one edit, for the docket as a whole</text>
  <path d="M570,110 L610,110" class="l"/>
  <!-- one instance with a receipt skips the docket -->
  <path d="M95,70 L95,44 L480,44 L480,70" class="l"/>
  <text x="285" y="38" text-anchor="middle" class="s">one instance with a receipt (the owner's message or a task record)</text>

  <!-- drop -->
  <path d="M610,135 L590,135 L590,245 L570,245" class="l"/>
  <text x="596" y="196" class="s">drop</text>

  <!-- apply with cases: trial, then the owner's yes -->
  <path d="M685,150 L685,210" class="acc"/>
  <text x="694" y="184" class="s" fill="#c2410c">apply, with cases</text>
  <path d="M685,280 L685,340" class="l"/>
  <text x="694" y="314" class="s">then the owner's yes</text>

  <!-- apply with no case: the owner's choice, around the trial -->
  <path d="M760,110 L830,110 L830,375 L760,375" class="acc"/>
  <text x="836" y="236" class="s" fill="#c2410c">apply,</text>
  <text x="836" y="250" class="s" fill="#c2410c">no case</text>
  <text x="836" y="264" class="s" fill="#c2410c">to trial</text>

  <!-- applied, then checked -->
  <path d="M610,375 L570,375" class="l"/>

  <!-- measured recurrence returns it to an observation -->
  <path d="M390,375 L95,375 L95,150" class="l"/>
  <text x="245" y="368" text-anchor="middle" class="s">a measured recurrence: back to an observation</text>
  <text x="480" y="428" text-anchor="middle" class="s">helped: the entry stays and keeps being counted</text>

  <text x="450" y="454" text-anchor="middle" class="cap">The agent never edits a method for a lesson; the runtime applies the owner's decision. An observation that belongs to a docket never expires.</text>
</svg>
