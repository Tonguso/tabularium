<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2d3142">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
  </defs>
  <style>
    .box{fill:#fff;stroke:#2d3142;stroke-width:1.5}
    .store{fill:#f3f4f6;stroke:#2d3142;stroke-width:1.5}
    .owner{fill:#fff;stroke:#c2410c;stroke-width:1.5}
    .t{font-weight:700}
    .s{fill:#6b7280;font-size:11px}
    .l{stroke:#6b7280;stroke-width:1.5;fill:none;marker-end:url(#a)}
    .acc{stroke:#c2410c;stroke-width:1.5;fill:none;marker-end:url(#b)}
    .lab{fill:#6b7280;font-size:11px}
  </style>

  <!-- top row -->
  <rect x="20" y="60" width="140" height="70" rx="6" class="box"/>
  <text x="90" y="86" text-anchor="middle" class="t">Correction</text>
  <text x="90" y="104" text-anchor="middle" class="s">the owner's words,</text>
  <text x="90" y="118" text-anchor="middle" class="s">or a failed check</text>

  <rect x="200" y="60" width="170" height="70" rx="6" class="store"/>
  <text x="285" y="86" text-anchor="middle" class="t">Proposed, with its edit</text>
  <text x="285" y="104" text-anchor="middle" class="s">exact replacement or one</text>
  <text x="285" y="118" text-anchor="middle" class="s">ledger entry; a case drafted</text>

  <rect x="410" y="60" width="170" height="70" rx="6" class="owner"/>
  <text x="495" y="86" text-anchor="middle" class="t">Owner's verdict</text>
  <text x="495" y="104" text-anchor="middle" class="s">dashboard or weekly message,</text>
  <text x="495" y="118" text-anchor="middle" class="s">settled by the runtime on arrival</text>

  <!-- right column -->
  <rect x="720" y="20" width="220" height="56" rx="6" class="store"/>
  <text x="830" y="42" text-anchor="middle" class="t">Trial</text>
  <text x="830" y="60" text-anchor="middle" class="s">frozen skills, benchmark cases, file checks</text>

  <rect x="720" y="124" width="220" height="56" rx="6" class="box"/>
  <text x="830" y="146" text-anchor="middle" class="t">Applied</text>
  <text x="830" y="164" text-anchor="middle" class="s">exactly the edit shown; version bumped</text>

  <rect x="720" y="220" width="220" height="56" rx="6" class="box"/>
  <text x="830" y="242" text-anchor="middle" class="t">Checked on the next real task</text>
  <text x="830" y="260" text-anchor="middle" class="s">helped or hurt, counted on the entry</text>

  <!-- bottom row -->
  <rect x="410" y="220" width="170" height="56" rx="6" class="store"/>
  <text x="495" y="242" text-anchor="middle" class="t">Verified</text>
  <text x="495" y="260" text-anchor="middle" class="s">stays in the ledger, keeps counting</text>

  <rect x="200" y="220" width="170" height="56" rx="6" class="box"/>
  <text x="285" y="242" text-anchor="middle" class="t">Retired</text>
  <text x="285" y="260" text-anchor="middle" class="s">dropped, or removed on his words</text>

  <!-- flows -->
  <path d="M160,95 L200,95" class="l"/>
  <path d="M370,95 L410,95" class="l"/>
  <path d="M580,80 L600,80 L600,48 L720,48" class="acc"/>
  <text x="660" y="64" text-anchor="middle" class="lab" fill="#c2410c">apply, trial possible</text>
  <path d="M580,110 L600,110 L600,152 L720,152" class="acc"/>
  <text x="660" y="168" text-anchor="middle" class="lab" fill="#c2410c">apply, no cases:</text>
  <text x="660" y="181" text-anchor="middle" class="lab" fill="#c2410c">reason kept</text>
  <path d="M830,76 L830,124" class="l"/>
  <text x="822" y="104" text-anchor="end" class="lab">report to the owner, then his yes</text>
  <path d="M830,180 L830,220" class="l"/>
  <path d="M720,248 L580,248" class="l"/>
  <text x="650" y="242" text-anchor="middle" class="lab">worked</text>
  <path d="M495,130 L495,196 L285,196 L285,220" class="acc"/>
  <text x="390" y="190" text-anchor="middle" class="lab" fill="#c2410c">drop</text>
  <path d="M760,276 L760,300 L285,300 L285,130" class="l"/>
  <text x="522" y="316" text-anchor="middle" class="lab">recurred: back to candidate, then re-proposed with a sharper edit</text>

  <text x="20" y="342" class="s">The agent never edits the skill for a lesson; the runtime applies the owner's decision. An unanswered candidate expires after thirty days unless it repeats.</text>
</svg>
